version: 2
updates:
  # Node.js
  - package-ecosystem: "npm"
    directory: "/cloud-run/sidecar/node"
    schedule:
      interval: "monthly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 2
  - package-ecosystem: "npm"
    directory: "/cloud-run/in-container/node"
    schedule:
      interval: "monthly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 2
  - package-ecosystem: "npm"
    directory: "/cloud-run-functions/node"
    schedule:
      interval: "monthly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 2

